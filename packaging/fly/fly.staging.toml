# Bookmeet staging on Fly.io (app "bookmeet-staging"): test data only, never a copy of production.
# The machine stays on (owner's decision, 2026-11-13): the Tailscale address below cannot
# wake a stopped machine, because a stopped machine is not on the tailnet. Customer copies
# are meant to stop when idle; to check that behaviour here, set auto_stop_machines = 'stop'
# and min_machines_running = 0 for the test, deploy, and put them back afterwards.
# Its own secrets (fly secrets list --app bookmeet-staging); nothing secret belongs here.
# Deploy with: packaging/fly/deploy.sh staging

app = 'bookmeet-staging'
primary_region = 'iad'

[build]

# Tailscale is built into this copy only, so the owner can open it from their own devices
# without the Cloudflare login: https://bookmeet-staging.<tailnet>.ts.net. It starts once the
# secret TAILSCALE_AUTHKEY is set (see entrypoint.sh); without it the app runs as before.
[build.args]
  TAILSCALE = '1'

[env]
  BASE_URL = 'https://staging.bookmeet.date'
  # staging.bookmeet.date sits behind a Cloudflare Access login, which Telegram cannot pass.
  TELEGRAM_WEBHOOK_BASE_URL = 'https://bookmeet-staging.fly.dev'
  DATABASE_URL = 'sqlite:///data/calnode.db'
  # Fly's private proxy range plus this app's own public addresses (fly ips list --app
  # bookmeet-staging); see the note in fly.toml. Through Cloudflare the visible hop is
  # Cloudflare's edge, which is fine for a staging copy.
  TRUSTED_PROXY_CIDRS = '172.16.0.0/12,66.241.125.42,2a09:8280:1::1f8:8856:0'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
