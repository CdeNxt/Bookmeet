<!-- BookMeet native public skin. Source controlled; settings are plain text, not injected HTML. -->
<script>
(function(){
 const root=document.documentElement;
 const configured=document.querySelector('meta[name="bookmeet-theme"]')?.content||'auto';
 const system=matchMedia('(prefers-color-scheme: dark)');
 let choice=configured;
 try{const saved=localStorage.getItem('bookmeet-appearance');if(['auto','light','dark'].includes(saved))choice=saved}catch(_){}
 function apply(){root.dataset.bmTheme=choice==='auto'?(system.matches?'dark':'light'):choice;root.style.colorScheme=root.dataset.bmTheme;document.dispatchEvent(new CustomEvent('bookmeet:theme'))}
 window.BookMeetTheme={get:()=>choice,set:value=>{if(!['auto','light','dark'].includes(value))return;choice=value;try{localStorage.setItem('bookmeet-appearance',value)}catch(_){}apply()}};
 system.addEventListener('change',()=>{if(choice==='auto')apply()});
 apply();
 // Liquid Glass level, 0 (clear) to 100 (tinted), set by the operator in Settings > Branding.
 // Applied here, in <head>, so the first painted frame already has the right glass.
 // Anything that is not a whole number (a missing or empty tag) means the middle, not clear.
 const glass=document.querySelector('meta[name="bookmeet-glass"]')?.content||'';
 root.style.setProperty('--bm-glass-t',String((/^\d+$/.test(glass)?Math.min(100,Number(glass)):50)/100));
 // A page reached by a view transition is animated by it. Any other arrival (a typed
 // address, a reload, a browser without cross-page transitions) gets the entrance instead.
 if('PageRevealEvent' in window)addEventListener('pagereveal',e=>{if(!e.viewTransition)root.classList.add('bm-no-vt')});
 else root.classList.add('bm-no-vt');
})();
</script>

 /* The blur grows with the square of the level. The field behind is drawn in one-pixel
    dots, which any real blur erases, so the clear end has to be almost sharp for the
    animation to show through; the frosting arrives in the upper half of the slider. */
 --bm-glass-blur:calc(var(--bm-glass-t)*var(--bm-glass-t)*26px);
 --bm-glass-filter:blur(var(--bm-glass-blur)) saturate(180%);--bm-glass-radius:26px;
 --bm-glass-edge:#ffffff30;--bm-glass-sheen:linear-gradient(135deg,#ffffff24 0%,#ffffff08 34%,#ffffff00 60%,#ffffff12 100%);

/* Bubble: a panel collapses to a round bead and inflates into what comes next, with one
   overshoot and one settle. The last keyframe sets no radius, so each panel lands on its own. */
@keyframes bm-bubble-in{
 0%{opacity:0;transform:scale(.16);border-radius:160px;animation-timing-function:cubic-bezier(.3,.7,.3,1)}
 10%{opacity:1;transform:scale(.3);border-radius:160px;animation-timing-function:cubic-bezier(.3,.7,.3,1)}
 52%{transform:scale(1.05);border-radius:30px;animation-timing-function:cubic-bezier(.45,0,.35,1)}
 78%{transform:scale(.985);animation-timing-function:cubic-bezier(.45,0,.35,1)}
 100%{opacity:1;transform:scale(1)}}
/* What is inside a bubble stays hidden while it is still a bead. */
@keyframes bm-bubble-fill{0%,45%{opacity:0}}
/* Page to page: one pass over the pair of page pictures - down to a bead, swap, inflate. */
@keyframes bm-bubble-swap{
 0%{transform:scale(1);border-radius:var(--bm-glass-radius);animation-timing-function:cubic-bezier(.5,0,1,.6)}
 27%{transform:scale(.18);border-radius:160px}
 33%{transform:scale(.18);border-radius:160px;animation-timing-function:cubic-bezier(.3,.7,.3,1)}
 68%{transform:scale(1.05);border-radius:30px;animation-timing-function:cubic-bezier(.45,0,.35,1)}
 86%{transform:scale(.985);border-radius:var(--bm-glass-radius);animation-timing-function:cubic-bezier(.45,0,.35,1)}
 100%{transform:scale(1);border-radius:var(--bm-glass-radius)}}
/* The pictures swap in one step while the bubble is a bead. A cross-fade here would leave
   the bead empty for a moment, which reads as the card vanishing. */
@keyframes bm-bubble-old{0%,30%{opacity:1}30.01%,100%{opacity:0}}
@keyframes bm-bubble-new{0%,30%{opacity:0}30.01%,100%{opacity:1}}
/* A view changing inside a panel that stays put: a small pop, not a whole bubble. */
@keyframes bm-pop{
 0%{opacity:0;transform:scale(.9);animation-timing-function:cubic-bezier(.3,.7,.3,1)}
 55%{opacity:1;transform:scale(1.02);animation-timing-function:cubic-bezier(.45,0,.35,1)}
 100%{opacity:1;transform:scale(1)}}
@keyframes bm-fade-in{from{opacity:0}}
@keyframes bm-fade-out{to{opacity:0}}

@media(prefers-reduced-motion:no-preference){
 /* Page to page. The card and the hero are the only things captured: the canvas behind
    them keeps drawing live, so the field never freezes or jumps during a navigation.
    The pair of card pictures is the bubble: it shrinks to a bead showing the old page,
    swaps, and inflates showing the new one, while the group underneath morphs between
    the two pages' card sizes. Every public page with a .card gets this, the assistant's
    chat page included. */
 @view-transition{navigation:auto}
 .bm-scene :is(.card,.dir-card){view-transition-name:bm-booking}
 .bm-scene .bm-hero{view-transition-name:bm-hero}
 :root{view-transition-name:none}
 ::view-transition{pointer-events:none}
 ::view-transition-group(bm-booking),::view-transition-group(bm-hero){animation-duration:1000ms;animation-timing-function:var(--bm-ease)}
 /* A captured card is a flat picture with no live backdrop, so the glass blur is put
    back on the bubble for the length of the transition. Without it the field shows
    through sharp and then snaps to blurred when the real card returns. */
 ::view-transition-image-pair(bm-booking){overflow:clip;-webkit-backdrop-filter:var(--bm-glass-filter);backdrop-filter:var(--bm-glass-filter);animation:bm-bubble-swap 1000ms both}
 ::view-transition-old(bm-booking){animation:bm-bubble-old 1000ms linear both}
 ::view-transition-new(bm-booking){animation:bm-bubble-new 1000ms linear both}
 ::view-transition-old(bm-hero){animation:bm-fade-out 260ms ease-in both}
 ::view-transition-new(bm-hero){animation:bm-fade-in 520ms var(--bm-ease) 330ms both}
 /* First arrival, and browsers without cross-page transitions: the card inflates from a bead. */
 html.bm-no-vt body.bm-scene :is(.card,.dir-card){animation:bm-bubble-in 720ms 60ms both}
 html.bm-no-vt body.bm-scene :is(.card,.dir-card)>*{animation:bm-bubble-fill 720ms 60ms both}
 html.bm-no-vt body.bm-scene .bm-hero{animation:bm-fade-in 620ms var(--bm-ease) both}
 /* Views inside the card. An element animates each time it comes back from display:none,
    which is how every view is switched, so no script is involved. On a phone, where a
    step replaces the whole card, the skin script re-inflates the card itself as well. */
 .bm-scene :is(#main-view,#slots-view,#form-view,#confirm-view,#reschedule-view,#confirm-reschedule-view,#cancel-confirm-view,#success-reschedule-view,#success-cancel-view):not(.hidden){animation:bm-pop 460ms both}
}

<script>

  let header=document.querySelector('body > header');
  if(!header){header=document.createElement('header');document.body.prepend(header)}
  {
   header.classList.add('bm-nav');
   const controls=document.createElement('div');controls.className='bm-nav-controls';
   if(text('nav_note')){const note=document.createElement('span');note.className='bm-nav-note';note.textContent=text('nav_note');controls.append(note)}

   const select=document.createElement('select');select.setAttribute('aria-label','Appearance');
   for(const [value,name] of [['auto','Auto'],['light','Light'],['dark','Dark']]){const option=document.createElement('option');option.value=value;option.textContent=name;select.append(option)}

   const icons={auto:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',dark:'<path d="M20.5 13.2A8.5 8.5 0 0 1 10.8 3.5a8.5 8.5 0 1 0 9.7 9.7Z"/>'};
   const chevron=document.createElementNS('http://www.w3.org/2000/svg','svg');chevron.classList.add('bm-theme-chevron');chevron.setAttribute('viewBox','0 0 16 16');chevron.setAttribute('fill','none');chevron.setAttribute('stroke','currentColor');chevron.setAttribute('stroke-width','1.5');chevron.setAttribute('stroke-linecap','round');chevron.setAttribute('stroke-linejoin','round');chevron.setAttribute('aria-hidden','true');chevron.innerHTML='<path d="m4 6 4 4 4-4"/>';
   select.value=window.BookMeetTheme.get();icon.innerHTML=icons[select.value];
   select.addEventListener('change',()=>{window.BookMeetTheme.set(select.value);icon.innerHTML=icons[select.value]});label.append(icon,select,chevron);controls.append(label);header.append(controls);
  }
  const manage=location.pathname.startsWith('/manage/'),directory=!!document.querySelector('.dir-card');
  const kind=manage?'manage':directory?'directory':'booking';
  const hero=document.createElement('section');hero.className='bm-hero';hero.setAttribute('aria-label','Welcome');
  for(const [tag,field,className] of [['p','eyebrow','bm-eyebrow'],['h2','title',''],['p','subtitle','bm-intro']]){

   const element=document.createElement(tag);element.className=className;element.textContent=value;hero.append(element);
  }
  const actions=document.createElement('div');actions.className='bm-actions';hero.append(actions);card.before(hero);
  const inline=document.getElementById('asst-open-inline');
  if(inline){const ai=document.createElement('button');ai.type='button';ai.textContent=text('ai_button')||'Find a time with AI';ai.addEventListener('click',()=>inline.click());actions.append(ai);inline.childNodes.forEach(n=>{if(n.nodeType===3&&n.textContent.trim())n.textContent=' '+ai.textContent+' '})}

  const phase=now=>((performance.timeOrigin+now)*.00012)%(50*Math.PI);

  function paint(time){
   const mobile=width<741;

   // motion reads as almost still. They get a faster clock, a wider sway and a slow drift
   // of their own. Every multiplier keeps the 50pi phase wrap seamless (whole turns only).

   for(const s of mobile?phoneStars:stars){ctx.fillStyle='rgba(188,195,220,'+(s.a*particleGain)+')';ctx.fillRect(s.x*width+px*9,s.y*height+py*6,1,1)}

    const span=half*(1+.14*Math.abs(z)),cy=height*.48+z*height*.70+py*20;
    const corners=[[-span,-depth],[span,-depth],[span,depth],[-span,depth]].map(([x,y])=>[width*.5+x*Math.cos(angle)-y*Math.sin(angle)+px*45,cy+(x*Math.sin(angle)+y*Math.cos(angle))*(.47+py*.025)]);

     const a=corners[k],b=corners[(k+1)%4];
     // Sample the unprojected edges, so dots keep their position as a plane rotates.
     const edge=k%2===0?span:depth;
     const n=Math.min(mobile?52:125,Math.max(10,Math.round(edge/(k%2===0?(mobile?3:2):(mobile?3:4)))));

     for(let q=0;q<n;q++){
      const f=q/n;let x=a[0]+edgeX*f,y=a[1]+edgeY*f;

      const dx=x-pointerX,dy=y-pointerY,dist=Math.hypot(dx,dy),near=Math.max(0,1-dist/200);

      ctx.fillStyle='rgba(188,194,220,'+Math.min(1,alpha*particleGain)+')';const size=near>.1?1.15:mobile?.95:.8;ctx.fillRect(x,y,size,size);

  addEventListener('pointermove',e=>{if(reduced.matches||e.pointerType==='touch')return;tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;pointerX=e.clientX+20;pointerY=e.clientY+20},{passive:true});

  reduced.addEventListener('change',()=>{if(raf){cancelAnimationFrame(raf);raf=0}tx=ty=px=py=0;pointerX=pointerY=-1000;paint(reduced.matches?0:phase(performance.now()));resume()});
