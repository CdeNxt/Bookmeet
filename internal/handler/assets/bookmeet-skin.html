<!-- BookMeet native public skin. Source controlled; settings are plain text, not injected HTML. -->
<script>
(function(){
 const root=document.documentElement;
 const configured=document.querySelector('meta[name="bookmeet-theme"]')?.content||'auto';
 const system=matchMedia('(prefers-color-scheme: dark)');
 let choice=configured;
 try{const saved=localStorage.getItem('bookmeet-appearance');if(['auto','light','dark'].includes(saved))choice=saved}catch(_){}
 function apply(){root.dataset.bmTheme=choice==='auto'?(system.matches?'dark':'light'):choice;root.style.colorScheme=root.dataset.bmTheme;document.dispatchEvent(new CustomEvent('bookmeet:theme'))}
 window.BookMeetTheme={get:()=>choice,set:value=>{if(!['auto','light','dark'].includes(value))return;choice=value;try{localStorage.setItem('bookmeet-appearance',value)}catch(_){}apply()}};
 system.addEventListener('change',()=>{if(choice==='auto')apply()});
 apply();
})();
</script>

html[data-bm-theme="light"] body.bm-scene .cookie-text{color:#606b87}
html[data-bm-theme="light"] body.bm-scene .cookie-btn{background:#f3f5fc;color:#3b476c;border-color:#c9d0e6}
html[data-bm-theme="light"] body.bm-scene .cookie-btn-primary{background:#5965e9;color:#fff}
@media(max-width:700px){.bm-nav-controls{gap:8px}.bm-scene .bm-nav .bm-nav-note{display:none}.bm-theme-control select{min-width:108px;height:42px;font-size:12px}}


.venue-choice{margin:16px 0 4px}
.venue-choice>label{
 display:inline-flex;gap:8px;align-items:center;padding:7px 11px;
 border:1px solid currentColor;border-radius:999px;font-size:13px;cursor:pointer
}
.venue-choice .venue-fields{display:grid;gap:8px;margin:16px 0 8px;min-width:0}
.venue-choice .venue-fields label{margin:0}
.venue-choice input[type=text]{width:100%;min-width:0;margin:0;padding:11px 12px;font-size:16px}
.venue-choice [hidden]{display:none!important}
.venue-input{position:relative;--venue-popup:#222636;--venue-line:#4a5069;--venue-highlight:#353e60;--venue-credit:#fff}
html[data-bm-theme=light] .venue-input{--venue-popup:#fff;--venue-line:#d8dbea;--venue-highlight:#eef0fc;--venue-credit:#5e5e5e}
html body.bm-scene .card:has(#venue-results:not([hidden])){overflow:visible}
.venue-choice .venue-input input[type=text]{padding-inline-end:52px}
.venue-map-icon{
 position:absolute;inset-block-start:50%;inset-inline-end:2px;transform:translateY(-50%);
 display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:8px;
 background:transparent;color:inherit;cursor:pointer
}
.venue-map-icon:disabled{opacity:.4;cursor:default}
.venue-map-icon:not(:disabled):hover,.venue-map-icon[aria-expanded=true]{background:var(--venue-highlight)}
#venue-results{
 position:absolute;inset:calc(100% + 4px) 0 auto;z-index:20;
 color:inherit;background:var(--venue-popup);border:1px solid var(--venue-line);
 border-radius:9px;box-shadow:0 8px 24px #0003;overflow:hidden
}
#venue-options{max-height:min(220px,35dvh);overflow:auto;overscroll-behavior:contain}
#venue-options [role=option]{
 display:flex;align-items:center;min-height:44px;padding:9px 11px;
 font-size:13px;line-height:1.4;overflow-wrap:anywhere;cursor:pointer
}
#venue-options [role=option]+[role=option],.venue-attribution{border-top:1px solid var(--venue-line)}
#venue-options [role=option]:hover,#venue-options [aria-selected=true]{background:var(--venue-highlight)}
.venue-attribution{color:var(--venue-credit);padding:6px 10px;text-align:end;font:400 12px/1.3 Roboto,sans-serif;white-space:nowrap}
#venue-map{width:100%;height:210px;border:0;border-radius:8px}
.directory-back{display:inline-block;margin-top:12px}
.venue-address{overflow-wrap:anywhere}
@keyframes bm-panel-in{from{transform:translateY(4px)}}
@keyframes bm-card-in{from{opacity:.88;transform:translateY(4px)}}
.bm-ver{margin:20px auto 0;text-align:center;font:400 10px/1.2 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.05em;color:#ffffff66;user-select:text}
html[data-bm-theme="light"] .bm-ver{color:#00000070}
@media(prefers-reduced-motion:no-preference){
 @view-transition{navigation:auto}
 .bm-scene :is(.card,.dir-card){view-transition-name:bm-booking}
 :root{view-transition-name:none}
 ::view-transition{pointer-events:none}
 ::view-transition-group(bm-booking){animation-duration:180ms}
 ::view-transition-old(bm-booking){display:none}
 ::view-transition-new(bm-booking){animation:bm-card-in 180ms ease-out both}
 html.bm-no-vt body.bm-scene :is(.card,.dir-card){animation:bm-panel-in 180ms ease-out both}
 .bm-scene :is(#slots-view,#form-view,#confirm-view,#reschedule-view,#confirm-reschedule-view,#cancel-confirm-view,#success-reschedule-view,#success-cancel-view):not(.hidden){animation:bm-panel-in 180ms ease-out both}
}

<script>
(function(){
 function init(){
  if(!document.querySelector('.card,.dir-card')||document.body.classList.contains('bm-scene'))return;
  document.body.classList.add('bm-scene');
  const card=document.querySelector('.card,.dir-card');card.id=card.id||'bm-booking';
  if(!('PageRevealEvent' in window))document.documentElement.classList.add('bm-no-vt');
  const buildVersion='__BM_VERSION__';
  if(buildVersion&&buildVersion.slice(0,2)!=='__'){const ver=document.createElement('div');ver.className='bm-ver';ver.textContent=buildVersion;ver.setAttribute('aria-hidden','true');document.body.appendChild(ver)}
  let copy={};try{copy=JSON.parse(document.querySelector('meta[name="bookmeet-copy"]')?.content||'{}')}catch(_){}
  const text=key=>typeof copy[key]==='string'?copy[key]:'';
  const header=document.querySelector('body > header');
  if(header){
   header.classList.add('bm-nav');
   const controls=document.createElement('div');controls.className='bm-nav-controls';
   if(text('nav_note')){const note=document.createElement('span');note.className='bm-nav-note';note.textContent=text('nav_note');controls.append(note)}
   const label=document.createElement('label');label.className='bm-theme-control';
   const select=document.createElement('select');select.setAttribute('aria-label','Appearance');
   for(const [value,name] of [['auto','Auto'],['light','Light'],['dark','Dark']]){const option=document.createElement('option');option.value=value;option.textContent=name;select.append(option)}
   const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.classList.add('bm-theme-icon');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('fill','none');icon.setAttribute('stroke','currentColor');icon.setAttribute('stroke-width','1.7');icon.setAttribute('stroke-linecap','round');icon.setAttribute('stroke-linejoin','round');icon.setAttribute('aria-hidden','true');
   const icons={auto:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',dark:'<path d="M20.5 13.2A8.5 8.5 0 0 1 10.8 3.5a8.5 8.5 0 1 0 9.7 9.7Z"/>'};
   const chevron=document.createElementNS('http://www.w3.org/2000/svg','svg');chevron.classList.add('bm-theme-chevron');chevron.setAttribute('viewBox','0 0 16 16');chevron.setAttribute('fill','none');chevron.setAttribute('stroke','currentColor');chevron.setAttribute('stroke-width','1.5');chevron.setAttribute('stroke-linecap','round');chevron.setAttribute('stroke-linejoin','round');chevron.setAttribute('aria-hidden','true');chevron.innerHTML='<path d="m4 6 4 4 4-4"/>';
   select.value=window.BookMeetTheme.get();icon.innerHTML=icons[select.value];
   select.addEventListener('change',()=>{window.BookMeetTheme.set(select.value);icon.innerHTML=icons[select.value]});label.append(icon,select,chevron);controls.append(label);header.append(controls);
  }
  const manage=location.pathname.startsWith('/manage/'),directory=!!document.querySelector('.dir-card');
  const kind=manage?'manage':directory?'directory':'booking';
  const hero=document.createElement('section');hero.className='bm-hero';hero.setAttribute('aria-label','Welcome');
  for(const [tag,field,className] of [['p','eyebrow','bm-eyebrow'],['h2','title',''],['p','subtitle','bm-intro']]){
   const value=text(kind+'_'+field);if(!value)continue;
   const element=document.createElement(tag);element.className=className;element.textContent=value;hero.append(element);
  }
  const actions=document.createElement('div');actions.className='bm-actions';hero.append(actions);card.before(hero);
  const inline=document.getElementById('asst-open-inline');
  if(inline){const ai=document.createElement('button');ai.type='button';ai.textContent=text('ai_button')||'Find a time with AI';ai.addEventListener('click',()=>inline.click());actions.append(ai);inline.childNodes.forEach(n=>{if(n.nodeType===3&&n.textContent.trim())n.textContent=' '+ai.textContent+' '})}
  const canvas=document.createElement('canvas');canvas.id='bm-field';canvas.setAttribute('aria-hidden','true');document.body.prepend(canvas);
  const ctx=canvas.getContext('2d');if(!ctx)return;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  let width=0,height=0,scale=0,raf=0,nextFrame=0,px=0,py=0,tx=0,ty=0,pointerX=-1000,pointerY=-1000;
  const stars=Array.from({length:520},(_,i)=>({x:((i*7919)%997)/997,y:((i*6271)%991)/991,a:.08+((i*13)%13)/100}));
  const phoneStars=stars.slice(0,200);
  const frameInterval=1000/30;
  // An absolute phase lets the incoming page draw the same field during navigation.
  const phase=now=>((performance.timeOrigin+now)*.00012)%(50*Math.PI);
  function resize(){
   const w=canvas.clientWidth,h=canvas.clientHeight,d=Math.min(devicePixelRatio||1,1.5);
   if(w===width&&h===height&&d===scale)return;
   width=w;height=h;scale=d;
   canvas.width=Math.round(width*scale);canvas.height=Math.round(height*scale);
   ctx.setTransform(scale,0,0,scale,0,0);
   paint(reduced.matches?0:phase(performance.now()));
  }
  function paint(time){
   px+=(tx-px)*.055;py+=(ty-py)*.055;
   canvas.style.transform='translate3d('+(-px*10).toFixed(2)+'px,'+(-py*7).toFixed(2)+'px,0)';
   // One painter in both modes: the light canvas is its exact CSS color inverse.
   ctx.fillStyle='#15161e';ctx.fillRect(0,0,width,height);
   const mobile=width<741;
   const themeGain=document.documentElement.dataset.bmTheme==='light'?1.25:1.15;
   const particleGain=themeGain*(mobile?1.18:1);
   for(const s of mobile?phoneStars:stars){ctx.fillStyle='rgba(188,195,220,'+(s.a*particleGain)+')';ctx.fillRect(s.x*width+px*9,s.y*height+py*6,1,1)}
   const planes=mobile?18:48,half=mobile?width*.48:Math.max(width*.43,440),depth=half*.33;
   for(let j=0;j<planes;j++){
    const z=(j/(planes-1)-.5)*2,angle=z*.64+.28*Math.sin(z*2.1+time)+time*.08+px*.22;
    const span=half*(1+.14*Math.abs(z)),cy=height*.48+z*height*.70+py*20;
    const corners=[[-span,-depth],[span,-depth],[span,depth],[-span,depth]].map(([x,y])=>[width*.5+x*Math.cos(angle)-y*Math.sin(angle)+px*45,cy+(x*Math.sin(angle)+y*Math.cos(angle))*(.47+py*.025)]);
    for(let k=0;k<4;k++){
     const a=corners[k],b=corners[(k+1)%4];
     // Sample the unprojected edges, so dots keep their position as a plane rotates.
     const edge=k%2===0?span:depth;
     const n=Math.min(mobile?52:125,Math.max(10,Math.round(edge/(k%2===0?(mobile?3:2):(mobile?3:4)))));
     const edgeX=b[0]-a[0],edgeY=b[1]-a[1];
     for(let q=0;q<n;q++){
      const f=q/n;let x=a[0]+edgeX*f,y=a[1]+edgeY*f;
      if(x < -16 || x > width+16 || y < -16 || y > height+16)continue;
      const dx=x-pointerX,dy=y-pointerY,dist=Math.hypot(dx,dy),near=Math.max(0,1-dist/200);
      if(dist>1&&near>0){x+=dx/dist*near*14;y+=dy/dist*near*14}
      const quiet=Math.min(1,.48+Math.abs(x-width*.5)/(width*.38));
      const alpha=(.20+.24*(.5+.5*Math.sin(q*.87+j*1.4+time*2))+near*.24)*quiet;
      ctx.fillStyle='rgba(188,194,220,'+Math.min(1,alpha*particleGain)+')';const size=near>.1?1.15:mobile?.95:.8;ctx.fillRect(x,y,size,size);
     }
    }
   }
   const shade=ctx.createRadialGradient(width*.5,height*.34,0,width*.5,height*.34,width*.54);shade.addColorStop(0,'rgba(21,22,30,.34)');shade.addColorStop(1,'rgba(21,22,30,0)');ctx.fillStyle=shade;ctx.fillRect(0,0,width,height);
  }
  function frame(now){
   raf=0;
   if(document.hidden||reduced.matches)return;
   if(now+1>=nextFrame){
    nextFrame=now-nextFrame>=frameInterval?now+frameInterval:nextFrame+frameInterval;
    paint(phase(now));
   }
   raf=requestAnimationFrame(frame);
  }
  function resume(){if(!document.hidden&&!reduced.matches&&!raf)raf=requestAnimationFrame(frame)}
  addEventListener('resize',resize,{passive:true});
  addEventListener('pointermove',e=>{if(reduced.matches||e.pointerType==='touch')return;tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;pointerX=e.clientX+20;pointerY=e.clientY+20},{passive:true});
  document.addEventListener('pointerleave',()=>{tx=0;ty=0;pointerX=-1000;pointerY=-1000});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&raf){cancelAnimationFrame(raf);raf=0}else resume()});
  reduced.addEventListener('change',()=>{if(raf){cancelAnimationFrame(raf);raf=0}tx=ty=px=py=0;pointerX=pointerY=-1000;paint(reduced.matches?0:phase(performance.now()));resume()});
  document.addEventListener('bookmeet:theme',()=>paint(reduced.matches?0:phase(performance.now())));
  resize();resume();
 }
 // Pages call this from the end of <body> (publicSkinReady) so the skin is on before the
 // first paint; DOMContentLoaded stays as the fallback. init() is safe to call twice.
 window.BookMeetSkinInit=init;
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{capture:true,once:true});else init();
})();
</script>
